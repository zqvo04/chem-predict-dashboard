# Hallmark · theme "Molecular Clinical Precision" — the Streamlit-native half of
# the design system, redesigned from a supplied design.md. Values mirror
# assets/tokens.css; keep the two in step when either changes.
# Configured through Streamlit's supported theme API (not CSS overrides) so it
# survives version upgrades.

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "Hanken Grotesk:https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"

baseFontSize = 15
baseRadius = "0.5rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

# h1–h6. The app leads with its own masthead, so h1 stays modest.
headingFontSizes = ["1.75rem", "1.5rem", "1.125rem", "1rem", "0.875rem", "0.8125rem"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600

[theme.light]
backgroundColor = "#F7F9FB"
secondaryBackgroundColor = "#F2F4F6"
textColor = "#191C1E"
primaryColor = "#085AC0"
borderColor = "#C6C6CD"
linkColor = "#002C66"
codeBackgroundColor = "#E0F2FE"
codeTextColor = "#002C66"
dataframeBorderColor = "#C6C6CD"
dataframeHeaderBackgroundColor = "#F2F4F6"
greenColor = "#019668"
greenBackgroundColor = "#DDF5E9"
greenTextColor = "#005232"
orangeColor = "#F59E0B"
orangeBackgroundColor = "#FFEBD2"
orangeTextColor = "#844100"

[theme.light.sidebar]
backgroundColor = "#F2F4F6"
secondaryBackgroundColor = "#ECEEF0"
borderColor = "#C6C6CD"
primaryColor = "#085AC0"
textColor = "#191C1E"

[theme.dark]
backgroundColor = "#10161F"
secondaryBackgroundColor = "#19202A"
textColor = "#EDEEF1"
primaryColor = "#5C94FD"
borderColor = "#2D333D"
linkColor = "#D8E2FF"
codeBackgroundColor = "#0F1F37"
codeTextColor = "#D8E2FF"
dataframeBorderColor = "#2D333D"
dataframeHeaderBackgroundColor = "#19202A"
greenColor = "#67DCA8"
greenBackgroundColor = "#062619"
greenTextColor = "#9CF0C7"
orangeColor = "#FAB45F"
orangeBackgroundColor = "#362207"
orangeTextColor = "#FFD49C"

[theme.dark.sidebar]
backgroundColor = "#070B13"
secondaryBackgroundColor = "#19202A"
borderColor = "#2D333D"
primaryColor = "#5C94FD"
textColor = "#EDEEF1"

[server]
maxUploadSize = 5
